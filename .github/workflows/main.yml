name: Main CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
            expected_os: Linux
            expected_arch: x86_64
          - target: windows-x64
            os: windows-2022
            expected_os: Windows
            expected_arch: AMD64
          - target: macos-arm64
            os: macos-15
            expected_os: Darwin
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify host and pinned Rust
        shell: bash
        run: |
          python -c 'import platform; assert platform.system() == "${{ matrix.expected_os }}"; assert platform.machine() == "${{ matrix.expected_arch }}"'
          test "$(rustc --version | cut -d' ' -f2)" = "1.97.1"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo build --workspace --all-targets --all-features --release
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo test --workspace --all-targets --all-features --release
      - run: python tools/validation/contracts.py full
      - run: python tools/validation/contracts.py package ${{ matrix.target }}

  pr-gate:
    name: PR Gate
    if: always()
    needs: [validate]
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete matrix success
        env:
          RESULT: ${{ needs.validate.result }}
        run: test "$RESULT" = success
